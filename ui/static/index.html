<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMake Workspace UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  :root{
    --c-bg:       #020912;
    --c-surface:  #060d1a;
    --c-panel:    #080e1c;
    --c-border:   #0d1f35;
    --c-border2:  #132840;
    --c-cyan:     #00c8e8;
    --c-cyan-dim: #006880;
    --c-green:    #00e87a;
    --c-blue:     #3b82f6;
    --c-text:     #c8dff0;
    --c-text-dim: #3a6080;
    --c-text-mid: #5a8aaa;
  }
  *{box-sizing:border-box}
  body{
    font-family:'JetBrains Mono',monospace;
    background:var(--c-bg);
    color:var(--c-text);
    position:relative;
  }
  /* Grid background */
  body::before{
    content:'';
    position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(0,200,232,0.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,200,232,0.025) 1px,transparent 1px);
    background-size:48px 48px;
    pointer-events:none;
    z-index:0;
  }
  body>*{position:relative;z-index:1}

  /* Scrollbar */
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:var(--c-bg)}
  ::-webkit-scrollbar-thumb{background:var(--c-cyan-dim);border-radius:2px}

  /* Inputs */
  input,select,textarea{
    background:var(--c-surface);
    color:var(--c-text);
    border:1px solid var(--c-border2);
    border-radius:0.25rem;
    font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;
    border-color:var(--c-cyan);
    box-shadow:0 0 0 1px var(--c-cyan),0 0 12px rgba(0,200,232,0.15);
  }

  /* Nav */
  .nav-item{
    display:flex;align-items:center;gap:0.6rem;
    width:100%;text-align:left;
    padding:0.4rem 0.75rem;
    border-radius:0.25rem;
    font-size:0.78rem;letter-spacing:0.03em;
    color:var(--c-text-dim);
    transition:all 0.15s;cursor:pointer;
    border:none;border-left:2px solid transparent;
    background:none;
  }
  .nav-item:hover{
    background:rgba(0,200,232,0.05);
    color:var(--c-text-mid);
    border-left-color:var(--c-border2);
  }
  .nav-item.active{
    background:rgba(0,200,232,0.07);
    color:var(--c-cyan);
    border-left-color:var(--c-cyan);
    box-shadow:inset 0 0 20px rgba(0,200,232,0.04);
  }

  /* Buttons */
  .btn{
    padding:0.35rem 1rem;
    border-radius:0.25rem;
    font-size:0.78rem;font-weight:500;letter-spacing:0.04em;
    cursor:pointer;border:1px solid;
    transition:all 0.15s;
    font-family:inherit;
  }
  .btn:disabled{opacity:0.35;cursor:not-allowed}
  .btn-blue{
    background:rgba(37,99,235,0.2);color:#60a5fa;
    border-color:#1e3a7a;
  }
  .btn-blue:hover:not(:disabled){
    background:rgba(37,99,235,0.35);border-color:#3b82f6;
    box-shadow:0 0 12px rgba(59,130,246,0.3);
  }
  .btn-slate{
    background:rgba(30,50,70,0.5);color:var(--c-text-mid);
    border-color:var(--c-border2);
  }
  .btn-slate:hover:not(:disabled){
    background:rgba(30,50,70,0.8);color:var(--c-text);
    border-color:#2a5070;
  }
  .btn-red{
    background:rgba(127,29,29,0.3);color:#fca5a5;
    border-color:#5a1010;
  }
  .btn-red:hover:not(:disabled){
    background:rgba(153,27,27,0.5);border-color:#991b1b;
    box-shadow:0 0 10px rgba(220,38,38,0.25);
  }
  .btn-green{
    background:rgba(0,232,122,0.1);color:#00e87a;
    border-color:#00703a;
  }
  .btn-green:hover:not(:disabled){
    background:rgba(0,232,122,0.2);border-color:#00e87a;
    box-shadow:0 0 12px rgba(0,232,122,0.25);
  }

  /* Cards */
  .card{
    background:var(--c-panel);
    border:1px solid var(--c-border);
    border-radius:0.375rem;
    padding:1rem;
    transition:border-color 0.2s,box-shadow 0.2s;
  }
  .card:hover{
    border-color:var(--c-border2);
    box-shadow:0 0 20px rgba(0,0,0,0.4),0 0 0 1px rgba(0,200,232,0.04);
  }

  /* Log / terminal */
  .log{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;line-height:1.7;
  }

  /* Section title with // prefix and separator line */
  .section-title{
    display:flex;align-items:center;gap:0.5rem;
    font-size:0.62rem;font-weight:700;
    text-transform:uppercase;letter-spacing:0.14em;
    color:var(--c-cyan);
    margin-bottom:0.75rem;
  }
  .section-title::before{content:'//';color:var(--c-border2);font-size:0.75rem}
  .section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--c-border2),transparent)}

  /* Tags */
  .tag{
    display:inline-block;
    padding:0.08rem 0.5rem;
    border-radius:2px;
    font-size:0.65rem;font-weight:600;letter-spacing:0.06em;
    border:1px solid transparent;
  }
  .tag-green{background:rgba(0,232,122,0.1);color:#00e87a;border-color:rgba(0,232,122,0.2)}
  .tag-gray{background:rgba(30,50,70,0.6);color:var(--c-text-mid);border-color:var(--c-border2)}

  /* Pulse dot */
  @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(0.8)}}
  .pulse{animation:pulse-dot 2s ease-in-out infinite}

  /* Glow text */
  .glow-cyan{text-shadow:0 0 8px rgba(0,200,232,0.6)}
  .glow-green{text-shadow:0 0 8px rgba(0,232,122,0.6)}

  /* Remap Tailwind gray palette to our dark-cyan theme */
  .text-gray-100,.text-gray-200{color:var(--c-text)!important}
  .text-gray-300,.text-gray-400{color:var(--c-text-mid)!important}
  .text-gray-500,.text-gray-600{color:var(--c-text-dim)!important}
  .text-gray-700{color:var(--c-border2)!important}
  .bg-gray-800{background:var(--c-border)!important}
  .bg-gray-900{background:var(--c-surface)!important}
  .bg-gray-950{background:var(--c-bg)!important}
  .border-gray-700,.border-gray-800{border-color:var(--c-border)!important}
  .hover\:border-gray-700:hover{border-color:var(--c-border2)!important}
  .hover\:bg-gray-800:hover{background:rgba(0,200,232,0.05)!important}
  .bg-green-500{background:#00e87a!important}
  .bg-gray-600{background:var(--c-border2)!important}

  /* Layout */
  aside{
    width:13rem;
    background:var(--c-surface);
    border-right:1px solid var(--c-border);
    flex-shrink:0;
    display:flex;flex-direction:column;
  }
  .sidebar-header{
    padding:1rem;
    border-bottom:1px solid var(--c-border);
  }
  .sidebar-header .ws-label{
    font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--c-text-dim);margin-bottom:0.25rem;
  }
  .sidebar-header .ws-name{
    font-size:0.8rem;font-weight:600;
    color:var(--c-cyan);
    text-shadow:0 0 10px rgba(0,200,232,0.4);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .sidebar-footer{
    padding:0.6rem 0.75rem;
    border-top:1px solid var(--c-border);
    font-size:0.62rem;color:var(--c-text-dim);
    letter-spacing:0.04em;
  }
  .page-header{
    border-bottom:1px solid var(--c-border);
  }
  .page-h1{
    font-size:0.95rem;font-weight:600;letter-spacing:0.03em;
    color:var(--c-text);
  }
  .border-panel{border-color:var(--c-border) !important}
  .sidebar-divider{border-color:var(--c-border) !important}

  /* Log terminal areas */
  .log-area{
    background:var(--c-bg);
    border:1px solid var(--c-border);
    border-radius:0.375rem;
    color:#4ade80;
  }
  .log-area-yellow{color:#fde68a}

  /* Reports panel */
  .reports-sidebar{
    width:15rem;
    border-right:1px solid var(--c-border);
    flex-shrink:0;display:flex;flex-direction:column;
  }
  .reports-sidebar-header{
    padding:0.75rem 1rem;
    border-bottom:1px solid var(--c-border);
  }
</style>
</head>
<body style="display:flex;height:100vh;overflow:hidden;background:var(--c-bg);color:var(--c-text)">

<!-- Sidebar -->
<aside>
  <div class="sidebar-header">
    <div class="ws-label">// Workspace</div>
    <div class="ws-name">monorepo-cmake</div>
  </div>
  <nav class="flex-1 p-2 space-y-0.5 overflow-y-auto" style="padding:0.5rem">
    <button class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
      <span style="font-size:0.85em">⊞</span> Dashboard
    </button>
    <button class="nav-item" data-page="build" onclick="navigate('build')">
      <span style="font-size:0.85em">⚙</span> Build
    </button>
    <button class="nav-item" data-page="targets" onclick="navigate('targets')">
      <span style="font-size:0.85em">◈</span> Targets
    </button>
    <button class="nav-item" data-page="new-project" onclick="navigate('new-project')">
      <span style="font-size:0.85em">＋</span> New Project
    </button>
    <button class="nav-item" data-page="watch" onclick="navigate('watch')">
      <span style="font-size:0.85em">◉</span> Watch Mode
    </button>
    <button class="nav-item" data-page="reports" onclick="navigate('reports')">
      <span style="font-size:0.85em">▤</span> Reports
    </button>
  </nav>
  <div class="sidebar-footer">CMake UI &middot; Python</div>
</aside>

<!-- Main -->
<main style="flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0">

<!-- ── Dashboard ── -->
<div id="page-dashboard" class="page flex-1 overflow-auto p-6 space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="page-h1">Dashboard</h1>
    <button class="btn btn-slate text-xs" onclick="loadDashboard()">↻ Refresh</button>
  </div>
  <div>
    <div class="section-title">Projects</div>
    <div id="dash-projects" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3"></div>
  </div>
  <div>
    <div class="section-title">Build Directories</div>
    <div id="dash-builds" class="space-y-2"></div>
  </div>
</div>

<!-- ── Build ── -->
<div id="page-build" class="page hidden flex-1 overflow-hidden flex flex-col">
  <div class="p-6 pb-4 page-header">
    <h1 class="page-h1 mb-4">Build</h1>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
      <label class="block">
        <div class="text-xs mb-1" style="color:var(--c-text-mid)">Build Dir</div>
        <input id="b-dir" type="text" value="build" class="w-full px-2.5 py-1.5 text-sm">
      </label>
      <label class="block">
        <div class="text-xs mb-1" style="color:var(--c-text-mid)">Generator</div>
        <select id="b-gen" class="w-full px-2.5 py-1.5 text-sm" onchange="onGenChange()">
          <option value="">(default)</option>
          <option>Ninja</option>
          <option>Ninja Multi-Config</option>
          <option>Unix Makefiles</option>
          <option>Visual Studio 17 2022</option>
          <option>Visual Studio 16 2019</option>
        </select>
      </label>
      <label class="block">
        <div class="text-xs mb-1" style="color:var(--c-text-mid)">Build Type</div>
        <select id="b-type" class="w-full px-2.5 py-1.5 text-sm">
          <option>Release</option>
          <option>Debug</option>
          <option>RelWithDebInfo</option>
          <option>MinSizeRel</option>
        </select>
      </label>
      <label class="block">
        <div class="text-xs mb-1" style="color:var(--c-text-mid)">Config (multi-gen)</div>
        <select id="b-config" class="w-full px-2.5 py-1.5 text-sm">
          <option value="">—</option>
          <option>Release</option>
          <option>Debug</option>
        </select>
      </label>
    </div>
    <div class="flex items-end gap-3 mb-3">
      <label class="block flex-1">
        <div class="text-xs mb-1" style="color:var(--c-text-mid)">Extra CMake Flags</div>
        <input id="b-extra" type="text" placeholder="-DFOO=bar" class="w-full px-2.5 py-1.5 text-sm">
      </label>
    </div>
    <div class="flex flex-wrap gap-2 items-center">
      <button class="btn btn-blue" onclick="runBuildAction('configure')">Configure</button>
      <button class="btn btn-blue" onclick="runBuildAction('build')">Build</button>
      <button class="btn btn-blue" onclick="runBuildAction('test')">Test</button>
      <button class="btn btn-slate" onclick="runBuildAction('report-all')">Report</button>
      <button class="btn btn-slate" onclick="runBuildAction('install')">Install</button>
      <button class="btn btn-red" onclick="runBuildAction('uninstall')">Uninstall</button>
      <button class="btn btn-slate ml-auto text-xs" onclick="document.getElementById('build-log').textContent=''">Clear log</button>
    </div>
    <div id="build-status" class="mt-2 text-sm hidden"></div>
  </div>
  <div class="flex-1 overflow-hidden p-6 pt-4">
    <div id="build-log" class="log log-area h-full p-3 overflow-auto whitespace-pre-wrap"></div>
  </div>
</div>

<!-- ── Targets ── -->
<div id="page-targets" class="page hidden flex-1 overflow-hidden flex flex-col">
  <div class="p-6 pb-3 page-header">
    <div class="flex items-center justify-between mb-3">
      <h1 class="page-h1">Target Dependencies</h1>
      <button class="btn btn-slate text-xs" onclick="loadTargets()">↻ Scan</button>
    </div>
    <div id="targets-filter" class="flex gap-1.5">
      <button class="tag tag-gray cursor-pointer hover:brightness-125 px-3 py-1" data-tf="all"   onclick="setTargetFilter('all')">All</button>
      <button class="tag tag-gray cursor-pointer hover:brightness-125 px-3 py-1" data-tf="exec"  onclick="setTargetFilter('exec')">Executables</button>
      <button class="tag tag-gray cursor-pointer hover:brightness-125 px-3 py-1" data-tf="test"  onclick="setTargetFilter('test')">Tests</button>
      <button class="tag tag-gray cursor-pointer hover:brightness-125 px-3 py-1" data-tf="lib"   onclick="setTargetFilter('lib')">Libraries</button>
      <button class="tag tag-gray cursor-pointer hover:brightness-125 px-3 py-1" data-tf="iface" onclick="setTargetFilter('iface')" style="border-color:rgba(168,85,247,0.3)">Interface</button>
    </div>
  </div>
  <div class="flex-1 overflow-auto p-6 space-y-6">
    <div id="targets-graph" class="card overflow-auto text-center text-sm py-8" style="color:var(--c-text-dim)">
      点击 Scan 加载依赖图
    </div>
    <div id="targets-metrics" class="hidden"></div>
    <div id="targets-table" class="space-y-3"></div>
  </div>
</div>

<!-- ── New Project ── -->
<div id="page-new-project" class="page hidden flex-1 overflow-auto p-6">
  <h1 class="page-h1 mb-5">New Project</h1>
  <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
    <div class="space-y-4">
      <div class="card space-y-3">
        <div class="section-title">Project Info</div>
        <label class="block">
          <div class="text-xs mb-1" style="color:var(--c-text-mid)">Project Name <span class="text-red-400">*</span></div>
          <input id="np-name" type="text" placeholder="myproject" class="w-full px-2.5 py-1.5 text-sm" oninput="updatePreview()">
        </label>
        <div class="grid grid-cols-2 gap-3">
          <label class="block">
            <div class="text-xs mb-1" style="color:var(--c-text-mid)">Version</div>
            <input id="np-ver" type="text" value="0.1.0" class="w-full px-2.5 py-1.5 text-sm">
          </label>
          <label class="block">
            <div class="text-xs mb-1" style="color:var(--c-text-mid)">Namespace</div>
            <input id="np-ns" type="text" placeholder="(= name)" class="w-full px-2.5 py-1.5 text-sm" oninput="updatePreview()">
          </label>
        </div>
      </div>

      <div class="card space-y-3">
        <div class="section-title">Modules</div>
        <!-- Library -->
        <div>
          <label class="flex items-center gap-2 cursor-pointer mb-2">
            <input id="np-lib" type="checkbox" checked class="w-4 h-4 accent-blue-500" onchange="toggleSection('lib'); updatePreview()">
            <span class="text-sm font-medium">Library target</span>
          </label>
          <div id="np-lib-fields" class="ml-6 grid grid-cols-3 gap-2">
            <label class="block">
              <div class="text-xs mb-1" style="color:var(--c-text-mid)">Dir name</div>
              <input id="np-lib-dir" type="text" placeholder="(= name)" class="w-full px-2.5 py-1.5 text-xs" oninput="updatePreview()">
            </label>
            <label class="block">
              <div class="text-xs mb-1" style="color:var(--c-text-mid)">Target name</div>
              <input id="np-lib-target" type="text" placeholder="(= name)" class="w-full px-2.5 py-1.5 text-xs" oninput="updatePreview()">
            </label>
            <label class="block">
              <div class="text-xs mb-1" style="color:var(--c-text-mid)">Type</div>
              <select id="np-lib-type" class="w-full px-2 py-1.5 text-xs" onchange="updatePreview()">
                <option value="LIBRARY">Static/Shared</option>
                <option value="INTERFACE">Interface (header-only)</option>
              </select>
            </label>
          </div>
        </div>
        <!-- App -->
        <div>
          <label class="flex items-center gap-2 cursor-pointer mb-2">
            <input id="np-app" type="checkbox" checked class="w-4 h-4 accent-blue-500" onchange="toggleSection('app'); updatePreview()">
            <span class="text-sm font-medium">Application target</span>
          </label>
          <div id="np-app-fields" class="ml-6 grid grid-cols-2 gap-2">
            <label class="block">
              <div class="text-xs mb-1" style="color:var(--c-text-mid)">Dir name</div>
              <input id="np-app-dir" type="text" value="app" class="w-full px-2.5 py-1.5 text-xs" oninput="updatePreview()">
            </label>
            <label class="block">
              <div class="text-xs mb-1" style="color:var(--c-text-mid)">Target name</div>
              <input id="np-app-target" type="text" placeholder="(= name_app)" class="w-full px-2.5 py-1.5 text-xs" oninput="updatePreview()">
            </label>
          </div>
        </div>
        <!-- Tests -->
        <div>
          <label class="flex items-center gap-2 cursor-pointer mb-2">
            <input id="np-test" type="checkbox" checked class="w-4 h-4 accent-blue-500" onchange="toggleSection('test'); updatePreview()">
            <span class="text-sm font-medium">Test target</span>
          </label>
          <div id="np-test-fields" class="ml-6 space-y-2">
            <div class="grid grid-cols-2 gap-2">
              <label class="block">
                <div class="text-xs mb-1" style="color:var(--c-text-mid)">Dir name</div>
                <input id="np-test-dir" type="text" value="tests/smoke" class="w-full px-2.5 py-1.5 text-xs" oninput="updatePreview()">
              </label>
              <label class="block">
                <div class="text-xs mb-1" style="color:var(--c-text-mid)">Target name</div>
                <input id="np-test-target" type="text" placeholder="(= name_smoke)" class="w-full px-2.5 py-1.5 text-xs" oninput="updatePreview()">
              </label>
            </div>
            <label class="flex items-center gap-2 cursor-pointer">
              <input id="np-test-gtest" type="checkbox" class="w-4 h-4" style="accent-color:var(--c-cyan)" onchange="updatePreview()">
              <span class="text-xs" style="color:var(--c-text-mid)">Use <span style="color:var(--c-cyan)">Google Test</span> <span style="color:var(--c-text-dim)">(FetchContent / find_package)</span></span>
            </label>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3 flex-wrap">
        <button class="btn btn-blue" onclick="submitNewProject()">Generate Project</button>
        <button class="btn btn-slate text-xs" onclick="loadPreset()">↑ Load preset</button>
        <label class="flex items-center gap-2 text-sm cursor-pointer" style="color:var(--c-text-mid)">
          <input id="np-force" type="checkbox" class="w-4 h-4 accent-yellow-500">
          Force overwrite
        </label>
        <label class="flex items-center gap-2 text-sm cursor-pointer" style="color:var(--c-text-mid)">
          <input id="np-save-preset" type="checkbox" class="w-4 h-4 accent-purple-500">
          Save preset
        </label>
      </div>
      <div id="np-status" class="text-sm hidden"></div>
    </div>

    <div>
      <div class="section-title">Generated Structure Preview</div>
      <div id="np-preview" class="log card text-xs min-h-48 whitespace-pre overflow-auto" style="color:var(--c-cyan);opacity:0.85"></div>
    </div>
  </div>
</div>

<!-- ── Watch ── -->
<div id="page-watch" class="page hidden flex-1 overflow-hidden flex flex-col">
  <div class="p-6 pb-4 page-header">
    <h1 class="page-h1 mb-4">Watch Mode</h1>
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-3">
      <label class="block">
        <div class="text-xs mb-1" style="color:var(--c-text-mid)">Build Dir</div>
        <input id="w-dir" type="text" value="build" class="w-full px-2.5 py-1.5 text-sm">
      </label>
      <label class="block">
        <div class="text-xs mb-1" style="color:var(--c-text-mid)">Generator</div>
        <select id="w-gen" class="w-full px-2.5 py-1.5 text-sm" onchange="onWatchGenChange()">
          <option value="">(default)</option>

<script>
// ─── Router ───────────────────────────────────────────────────────────────────
function navigate(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('page-' + page);
  if (el) { el.classList.remove('hidden'); el.style.display = ''; }
  const btn = document.querySelector('[data-page="' + page + '"]');
  if (btn) btn.classList.add('active');
  if (page === 'dashboard') loadDashboard();
  if (page === 'reports') loadReports();
  if (page === 'targets') loadTargets();
  if (page === 'new-project') updatePreview();
}

// ─── API ──────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.body = JSON.stringify(body);
    opts.headers['Content-Type'] = 'application/json';
  }
  const r = await fetch(path, opts);
  return r.json();
}

// ─── SSE streaming ────────────────────────────────────────────────────────────
let _activeSource = null;

function streamJob(jobId, logEl, onDone) {
  if (_activeSource) { _activeSource.close(); _activeSource = null; }
  const es = new EventSource('/api/stream?job=' + jobId);
  _activeSource = es;
  es.addEventListener('line', e => {
    logEl.textContent += JSON.parse(e.data) + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  });
  es.addEventListener('done', e => {
    const code = JSON.parse(e.data);
    const ok = code === '0';
    logEl.textContent += '\n[Exit ' + code + ']' + (ok ? ' ✓' : ' ✗') + '\n';
    logEl.scrollTop = logEl.scrollHeight;
    es.close(); _activeSource = null;
    if (onDone) onDone(ok);
  });
  es.onerror = () => { es.close(); _activeSource = null; if (onDone) onDone(false); };
}

// ─── Dashboard ────────────────────────────────────────────────────────────────
async function loadDashboard() {
  const [projects, buildDirs] = await Promise.all([
    api('GET', '/api/projects'), api('GET', '/api/build-dirs')
  ]);
  const pEl = document.getElementById('dash-projects');
  if (!projects.length) {
    pEl.innerHTML = '<p class="text-sm" style="color:var(--c-text-dim)">No projects found.</p>';
  } else {
    pEl.innerHTML = projects.map(p => `
      <div class="card" style="cursor:default">
        <div class="flex items-start justify-between mb-2">
          <div>
            <div class="font-semibold text-sm" style="color:var(--c-text)">${esc(p.name)}</div>
            <div class="text-xs font-mono mt-0.5" style="color:var(--c-text-dim)">${esc(p.path)}</div>
          </div>
          <div class="flex items-center gap-2">
            <span class="tag tag-gray">${p.modules.length} mod</span>
            <button class="text-xs" style="color:#f87171" title="删除整个项目"
              onclick="deleteProject('${esc(p.path)}','${esc(p.name)}')">✕</button>
          </div>
        </div>
        <div class="space-y-0.5">
          ${p.modules.map(m => `
            <div class="text-xs font-mono flex items-center gap-1.5 group" style="color:var(--c-cyan);opacity:0.8">
              <span style="color:var(--c-border2)">├─</span>
              <span class="flex-1">${esc(m)}</span>
              <button class="opacity-0 group-hover:opacity-100 transition-opacity px-1" style="color:#f87171"
                title="删除模块"
                onclick="deleteModule('${esc(p.path)}','${esc(m)}')">✕</button>
            </div>`).join('')}
        </div>
      </div>
    `).join('');
  }

  const bEl = document.getElementById('dash-builds');
  if (!buildDirs.length) {
    bEl.innerHTML = '<p class="text-sm" style="color:var(--c-text-dim)">No build directories found yet.</p>';
  } else {
    // Fetch test results for all build dirs in parallel
    const testResults = await Promise.all(
      buildDirs.map(d => api('GET', '/api/test-results?build=' + encodeURIComponent(d.name)))
    );
    bEl.innerHTML = buildDirs.map((d, i) => {
      const tr = testResults[i];
      const hasResults = tr && tr.total > 0;
      const dot = d.configured
        ? 'style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--c-green);box-shadow:0 0 6px var(--c-green)"'
        : 'style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--c-text-dim)"';
      return `
      <div class="card space-y-2">
        <div class="flex items-center gap-3">
          <span ${dot}></span>
          <span class="font-mono text-sm" style="color:var(--c-text)">${esc(d.name)}</span>
          <span class="tag ${d.configured ? 'tag-green' : 'tag-gray'} ml-1">${d.configured ? 'configured' : 'unconfigured'}</span>
          <div class="ml-auto flex gap-2">
            <button class="text-xs" style="color:var(--c-cyan);opacity:0.8" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.8" onclick="quickAction('${esc(d.name)}','build')">Build →</button>
            <button class="text-xs" style="color:var(--c-text-mid)" onmouseover="this.style.color='var(--c-text)'" onmouseout="this.style.color='var(--c-text-mid)'" onclick="quickAction('${esc(d.name)}','test')">Test →</button>
            <button class="text-xs" style="color:#f87171" onclick="deleteBuildDir('${esc(d.name)}')">删除</button>
          </div>
        </div>
        ${hasResults ? renderTestPanel(tr) : ''}
      </div>`;
    }).join('');
  }
}

function renderTestPanel(tr) {
  const passRate = tr.total > 0 ? Math.round(tr.passed / tr.total * 100) : 0;
  const allPassed = tr.failed === 0;
  const barColor = allPassed ? 'bg-green-500' : 'bg-red-500';
  const summary = `${tr.passed}/${tr.total} passed` +
    (tr.failed ? ` · <span class="text-red-400">${tr.failed} failed</span>` : '') +
    (tr.skipped ? ` · <span class="text-yellow-400">${tr.skipped} skipped</span>` : '');
  const rows = tr.tests.map(t => {
    const icon = t.status === 'passed' ? '<span class="text-green-400">✓</span>'
               : t.status === 'skipped' ? '<span class="text-yellow-400">⊝</span>'
               : '<span class="text-red-400">✗</span>';
    const msg = t.message ? `<div class="text-red-300 text-xs pl-4 mt-0.5 font-mono whitespace-pre-wrap">${esc(t.message)}</div>` : '';
    return `<div>
      <div class="flex items-center gap-2 text-xs py-0.5">
        ${icon}
        <span class="${t.status === 'failed' ? 'text-red-300' : t.status === 'skipped' ? 'text-yellow-300' : 'text-gray-300'}">${esc(t.name)}</span>
        <span class="ml-auto text-gray-600">${t.time}s</span>
      </div>${msg}</div>`;
  }).join('');

  return `
    <div class="pt-2 space-y-1.5" style="border-top:1px solid var(--c-border)">
      <div class="flex items-center gap-2">
        <div class="flex-1 h-1.5 rounded-full overflow-hidden" style="background:var(--c-border)">
          <div class="${barColor} h-full rounded-full transition-all" style="width:${passRate}%"></div>
        </div>
        <span class="text-xs" style="color:var(--c-text-mid)">${summary}</span>
      </div>
      <div class="space-y-0.5">${rows}</div>
    </div>`;
}

function quickAction(dir, action) {
  document.getElementById('b-dir').value = dir;
  navigate('build');
  setTimeout(() => runBuildAction(action), 100);
}

async function deleteProject(projPath, projName) {
  if (!confirm(`确认删除项目 "${projName}"？\n路径：${projPath}\n包含所有模块，此操作不可恢复。`)) return;
  const res = await api('POST', '/api/delete', { kind: 'project', path: projPath });
  if (res.error) { alert('删除失败：' + res.error); return; }
  loadDashboard();
}

async function deleteModule(projPath, modName) {
  if (!confirm(`确认删除模块 "${modName}"？\n路径：${projPath}/${modName}\n此操作不可恢复。`)) return;
  const res = await api('POST', '/api/delete', { kind: 'module', path: projPath + '/' + modName });
  if (res.error) { alert('删除失败：' + res.error); return; }
  loadDashboard();
}

async function deleteBuildDir(name) {
  if (!confirm(`确认删除构建目录 "${name}"？\n此操作不可恢复。`)) return;
  const res = await api('POST', '/api/delete', { kind: 'build', path: name });
  if (res.error) { alert('删除失败：' + res.error); return; }
  loadDashboard();
}

const MULTI_CONFIG_GENS = ['Ninja Multi-Config', 'Visual Studio 17 2022', 'Visual Studio 16 2019'];

function onGenChange() {
  const gen = document.getElementById('b-gen').value;
  const btypeEl = document.getElementById('b-type');
  const isMulti = MULTI_CONFIG_GENS.includes(gen);
  btypeEl.disabled = isMulti;
  btypeEl.title = isMulti ? '多配置生成器在 configure 时不设置 BUILD_TYPE，请在 Config 栏选择' : '';
}

// ─── Build ────────────────────────────────────────────────────────────────────
async function runBuildAction(action) {
  const dir = document.getElementById('b-dir').value.trim() || 'build';
  const gen = document.getElementById('b-gen').value;
  const btype = document.getElementById('b-type').value;
  const config = document.getElementById('b-config').value;
  const extra = document.getElementById('b-extra').value.trim();
  const logEl = document.getElementById('build-log');
  const statusEl = document.getElementById('build-status');

  const multiConfig = ['Ninja Multi-Config', 'Visual Studio 17 2022', 'Visual Studio 16 2019'].includes(gen);
  let cmd;
  if (action === 'configure') {
    cmd = ['cmake', '-S', '.', '-B', dir];
    if (gen) cmd.push('-G', gen);
    if (btype && !multiConfig) cmd.push('-DCMAKE_BUILD_TYPE=' + btype);
    if (extra) extra.split(/\s+/).forEach(f => f && cmd.push(f));
  } else if (action === 'build') {
    cmd = ['cmake', '--build', dir];
    if (config) cmd.push('--config', config);
  } else if (action === 'test') {
    cmd = ['ctest', '--test-dir', dir, '--output-on-failure'];
    if (config) cmd.push('-C', config);
  } else if (action === 'report-all') {
    cmd = ['cmake', '--build', dir, '--target', 'report-all'];
    if (config) cmd.push('--config', config);
  } else if (action === 'install') {
    cmd = ['cmake', '--install', dir];
    if (config) cmd.push('--config', config);
  } else if (action === 'uninstall') {
    cmd = ['cmake', '--build', dir, '--target', 'uninstall'];
  }

  logEl.textContent += '\n$ ' + cmd.join(' ') + '\n';
  logEl.scrollTop = logEl.scrollHeight;

  statusEl.className = 'mt-2 text-sm text-yellow-400';
  statusEl.textContent = 'Running ' + action + '...';
  statusEl.classList.remove('hidden');

  const res = await api('POST', '/api/run', { cmd });
  if (res.error) {
    statusEl.className = 'mt-2 text-sm text-red-400';
    statusEl.textContent = 'Error: ' + res.error;
    return;
  }
  streamJob(res.job_id, logEl, ok => {
    statusEl.className = 'mt-2 text-sm ' + (ok ? 'text-green-400' : 'text-red-400');
    statusEl.textContent = action + (ok ? ' succeeded ✓' : ' failed ✗');
  });
}

// ─── New Project ──────────────────────────────────────────────────────────────
function toggleSection(id) {
  const checked = document.getElementById('np-' + id).checked;
  document.getElementById('np-' + id + '-fields').style.display = checked ? '' : 'none';
}

async function loadPreset() {
  const preset = await api('GET', '/api/preset');
  if (!preset || !preset.project_name) {
    alert('未找到 preset.json，请先生成项目并勾选 Save preset。');
    return;
  }
  // 基本信息
  document.getElementById('np-name').value = preset.project_name || '';
  document.getElementById('np-ver').value = preset.project_version || '0.1.0';
  document.getElementById('np-ns').value = preset.project_namespace || '';

  // 各 target
  const lib = (preset.targets || []).find(t => t.kind === 'lib');
  const app = (preset.targets || []).find(t => t.kind === 'app');
  const test = (preset.targets || []).find(t => t.kind === 'test');

  document.getElementById('np-lib').checked = !!lib;
  toggleSection('lib');
  if (lib) {
    document.getElementById('np-lib-dir').value = lib.dir || '';
    document.getElementById('np-lib-target').value = lib.name || '';
    document.getElementById('np-lib-type').value = lib.type === 'INTERFACE' ? 'INTERFACE' : 'LIBRARY';
  }

  document.getElementById('np-app').checked = !!app;
  toggleSection('app');
  if (app) {
    document.getElementById('np-app-dir').value = app.dir || '';
    document.getElementById('np-app-target').value = app.name || '';
  }

  document.getElementById('np-test').checked = !!test;
  toggleSection('test');
  if (test) {
    document.getElementById('np-test-dir').value = test.dir || '';
    document.getElementById('np-test-target').value = test.name || '';
    document.getElementById('np-test-gtest').checked = !!test.use_gtest;
  }

  updatePreview();
}

function updatePreview() {
  const name = document.getElementById('np-name').value.trim();
  const el = document.getElementById('np-preview');
  if (!name) { el.textContent = '(enter a project name to preview)'; return; }
  const lines = ['projects/' + name + '/  ← workspace_dir', '  CMakeLists.txt'];
  if (document.getElementById('np-lib').checked) {
    const d = document.getElementById('np-lib-dir').value.trim() || name;
    const t = document.getElementById('np-lib-target').value.trim() || name;
    const isIface = document.getElementById('np-lib-type').value === 'INTERFACE';
    lines.push('  ' + d + '/  ' + (isIface ? '← header-only (INTERFACE)' : '← library'));
    lines.push('    CMakeLists.txt');
    if (!isIface) lines.push('    ' + t + '.cpp');
    lines.push('    ' + t + '.h');
  }
  if (document.getElementById('np-app').checked) {
    const d = document.getElementById('np-app-dir').value.trim() || 'app';
    lines.push('  ' + d + '/');
    lines.push('    CMakeLists.txt');
    lines.push('    main.cpp');
  }
  if (document.getElementById('np-test').checked) {
    const d = document.getElementById('np-test-dir').value.trim() || 'tests/smoke';
    const testSrc = d.split('/').filter(Boolean).pop() || 'smoke';
    const gtest = document.getElementById('np-test-gtest').checked;
    lines.push('  ' + d + '/  ← ' + (gtest ? 'GTest (gtest_discover_tests)' : 'CTest (add_test)'));
    lines.push('    CMakeLists.txt');
    lines.push('    ' + testSrc + '.cpp');
  }
  el.textContent = lines.join('\n');
}

async function submitNewProject() {
  const name = document.getElementById('np-name').value.trim();
  const statusEl = document.getElementById('np-status');
  if (!name) {
    statusEl.className = 'text-sm text-red-400'; statusEl.textContent = 'Project name is required.';
    statusEl.classList.remove('hidden'); return;
  }
  const ver = document.getElementById('np-ver').value.trim() || '0.1.0';
  const ns = document.getElementById('np-ns').value.trim() || name;
  const inclLib = document.getElementById('np-lib').checked;
  const inclApp = document.getElementById('np-app').checked;
  const inclTest = document.getElementById('np-test').checked;
  const targets = [], modules = [];

  if (inclLib) {
    const ld = document.getElementById('np-lib-dir').value.trim() || name;
    const lt = document.getElementById('np-lib-target').value.trim() || name;
    const ltype = document.getElementById('np-lib-type').value; // LIBRARY | INTERFACE
    const isIface = ltype === 'INTERFACE';
    targets.push({ dir: ld, name: lt, type: ltype, kind: 'lib',
      alias_prefix: ns, enable_install: true,
      sources: isIface ? [] : [lt+'.cpp'],
      headers: [lt+'.h'] });
    modules.push(ld);
  }
  if (inclApp) {
    const ad = document.getElementById('np-app-dir').value.trim() || 'app';
    const at = document.getElementById('np-app-target').value.trim() || name + '_app';
    const libT = targets.find(t => t.kind === 'lib');
    targets.push({ dir: ad, name: at, type: 'EXECUTABLE', kind: 'app',
      private_deps: libT ? [ns + '::' + libT.name] : [],
      enable_install: true, sources: ['main.cpp'] });
    modules.push(ad);
  }
  // CMake reserved target names when CTest is enabled
  const CMAKE_RESERVED = ['test', 'install', 'package', 'package_source', 'edit_cache',
    'rebuild_cache', 'clean', 'all', 'ALL_BUILD', 'ZERO_CHECK'];
  if (inclTest) {
    const td = document.getElementById('np-test-dir').value.trim() || 'tests/smoke';
    const tt = document.getElementById('np-test-target').value.trim() || name + '_smoke';
    if (CMAKE_RESERVED.includes(tt)) {
      statusEl.className = 'text-sm text-red-400';
      statusEl.textContent = `目标名 "${tt}" 是 CMake 保留名称，启用 CTest 后不可使用。请改用如 "${name}_smoke" 等名称。`;
      statusEl.classList.remove('hidden'); return;
    }
    const libT = targets.find(t => t.kind === 'lib');
    const testSrc = td.split('/').filter(Boolean).pop() || 'smoke';
    const useGTest = document.getElementById('np-test-gtest').checked;
    targets.push({ dir: td, name: tt, type: 'EXECUTABLE', kind: 'test',
      private_deps: libT ? [ns + '::' + libT.name] : [],
      sources: [testSrc + '.cpp'],
      use_gtest: useGTest });
  }

  const cfg = {
    project_name: name, project_version: ver, project_namespace: ns,
    workspace_dir: 'projects/' + name,
    modules, include_tests: inclTest, targets,
    force: document.getElementById('np-force').checked,
    save_preset: document.getElementById('np-save-preset').checked,
  };

  statusEl.className = 'text-sm text-yellow-400';
  statusEl.textContent = 'Generating...';
  statusEl.classList.remove('hidden');

  const res = await api('POST', '/api/new-project', cfg);
  if (res.ok) {
    statusEl.className = 'text-sm text-green-400';
    statusEl.textContent = '✓ Created projects/' + name + '  —  run Configure + Build to compile.';
  } else {
    statusEl.className = 'text-sm text-red-400';
    statusEl.textContent = 'Error: ' + res.error;
  }
}

// ─── Watch ────────────────────────────────────────────────────────────────────
function onWatchGenChange() {
  const gen = document.getElementById('w-gen').value;
  const isMulti = MULTI_CONFIG_GENERATORS.includes(gen);
  document.getElementById('w-type').disabled = isMulti;
  document.getElementById('w-config').disabled = !isMulti;
}

async function startWatch() {
  const dir = document.getElementById('w-dir').value.trim() || 'build';
  const gen = document.getElementById('w-gen').value;
  const btype = document.getElementById('w-type').value;
  const config = document.getElementById('w-config').value;
  const interval = document.getElementById('w-interval').value;
  const isMulti = MULTI_CONFIG_GENERATORS.includes(gen);
  const logEl = document.getElementById('watch-log');

  const cmd = ['python', 'cmake/watch_build.py', '--build', dir, '--interval', String(interval)];
  if (gen) { cmd.push('--generator', gen); }
  if (isMulti) {
    if (config) { cmd.push('--config', config); }
  } else {
    cmd.push('--build-type', btype);
  }

  logEl.textContent += '\n$ ' + cmd.join(' ') + '\n';
  const res = await api('POST', '/api/run', { cmd });
  if (res.error) {
    document.getElementById('w-status').textContent = 'Error: ' + res.error;
    return;
  }
  document.getElementById('w-start-btn').classList.add('hidden');
  document.getElementById('w-stop-btn').classList.remove('hidden');
  document.getElementById('w-status').textContent = 'Watching…';

  streamJob(res.job_id, logEl, () => {
    document.getElementById('w-start-btn').classList.remove('hidden');
    document.getElementById('w-stop-btn').classList.add('hidden');
    document.getElementById('w-status').textContent = 'Stopped.';
  });
}

function stopWatch() {
  if (_activeSource) { _activeSource.close(); _activeSource = null; }
  document.getElementById('w-start-btn').classList.remove('hidden');
  document.getElementById('w-stop-btn').classList.add('hidden');
  document.getElementById('w-status').textContent = 'Stream closed (background process may persist).';
}

let _targetFilter = 'all';

mermaid.initialize({ startOnLoad: false, theme: 'base',

    background: '#020912',
    primaryColor: '#060d1a',
    primaryBorderColor: '#0d1f35',
    primaryTextColor: '#c8dff0',

    edgeLabelBackground: '#020912',
    clusterBkg: '#060d1a',
    clusterBorder: '#0d1f35',
    titleColor: '#c8dff0',
    fontFamily: 'JetBrains Mono, monospace',
    fontSize: '12px',
  }
});

async function loadTargets() {
  document.getElementById('targets-graph').innerHTML =
    '<div class="text-sm py-8" style="color:var(--c-text-dim);text-align:center">// scanning…</div>';
  document.getElementById('targets-table').innerHTML = '';
  const data = await api('GET', '/api/target-graph');
  if (data.error) {
    document.getElementById('targets-graph').innerHTML =
      '<div class="text-red-400 text-sm py-4">' + esc(data.error) + '</div>';
    return;
  }
  _targetData = data;
  renderTargets();
}

function setTargetFilter(f) {
  _targetFilter = f;
  document.querySelectorAll('[data-tf]').forEach(b => {
    b.className = b.dataset.tf === f
      ? 'tag tag-green cursor-pointer px-3 py-1'
      : 'tag tag-gray cursor-pointer hover:brightness-125 px-3 py-1';
  });
  if (_targetData) renderTargets();
}

function renderTargets() {
  renderTargetGraph(_targetData, _targetFilter);
  renderMetricsTable(_targetData, _targetFilter);
  renderTargetTable(_targetData, _targetFilter);
}

function renderMetricsTable(data, filter) {
  const el = document.getElementById('targets-metrics');
  let nodes = data.nodes;
  if (filter === 'exec') nodes = nodes.filter(n => n.type === 'executable' && !n.is_test);
  else if (filter === 'test')  nodes = nodes.filter(n => n.is_test);
  else if (filter === 'lib')   nodes = nodes.filter(n => n.type === 'library');
  else if (filter === 'iface') nodes = nodes.filter(n => n.type === 'interface');

  // Sort by instability desc, then by name
  const sorted = [...nodes].sort((a, b) => {
    const ia = a.metrics.instability ?? -1;
    const ib = b.metrics.instability ?? -1;
    return ib - ia || a.id.localeCompare(b.id);
  });

  const iBar = (v) => {
    if (v === null) return '<span class="text-gray-600">—</span>';
    const pct = Math.round(v * 100);
    const color = v < 0.3 ? 'bg-green-600' : v < 0.7 ? 'bg-yellow-500' : 'bg-red-600';
    return `<div class="flex items-center gap-2">
      <div class="w-16 h-1.5 bg-gray-800 rounded-full overflow-hidden">
        <div class="${color} h-full rounded-full" style="width:${pct}%"></div>
      </div>
      <span class="text-xs font-mono ${v < 0.3 ? 'text-green-400' : v < 0.7 ? 'text-yellow-400' : 'text-red-400'}">${v.toFixed(2)}</span>
    </div>`;
  };

  const hasCycle = nodes.some(n => n.metrics.in_cycle);

  el.className = 'card overflow-auto';
  el.innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <div class="section-title mb-0">耦合度指标</div>
      ${hasCycle ? '<span class="tag" style="background:#7f1d1d;color:#fca5a5">⚠ 检测到循环依赖</span>' : ''}
    </div>
    <table class="w-full text-xs">
      <thead>
        <tr class="border-b border-gray-800 text-gray-500">
          <th class="text-left py-2 pr-4 font-medium">Target</th>
          <th class="text-left py-2 pr-4 font-medium" title="Afferent: 依赖本模块的数量">Ca ↑</th>
          <th class="text-left py-2 pr-4 font-medium" title="Efferent: 本模块依赖的数量">Ce ↓</th>
          <th class="text-left py-2 pr-4 font-medium" title="Instability = Ce/(Ca+Ce)，0=稳定 1=不稳定">I 不稳定性</th>
          <th class="text-left py-2 pr-4 font-medium" title="传递依赖总数">传递依赖</th>
          <th class="text-left py-2 font-medium">状态</th>
        </tr>
      </thead>
      <tbody>
        ${sorted.map(n => {
          const m = n.metrics;
          const cycleTag = m.in_cycle ? '<span class="tag" style="background:#7f1d1d;color:#fca5a5;font-size:0.6rem">CYCLE</span>' : '';
          const stableTag = m.instability !== null && m.instability < 0.3 && m.ca > 0
            ? '<span class="tag tag-green" style="font-size:0.6rem">STABLE</span>' : '';
          return `<tr class="border-b border-gray-800 hover:bg-gray-900">
            <td class="py-2 pr-4 font-mono text-gray-200">${esc(n.id)}</td>
            <td class="py-2 pr-4 text-blue-400 font-mono">${m.ca}</td>
            <td class="py-2 pr-4 text-purple-400 font-mono">${m.ce}</td>
            <td class="py-2 pr-4">${iBar(m.instability)}</td>
            <td class="py-2 pr-4 text-gray-400 font-mono">${m.transitive_count}</td>
            <td class="py-2 flex gap-1">${cycleTag}${stableTag}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    <div class="mt-3 text-xs space-y-0.5" style="color:var(--c-text-dim)">
      <div><span class="text-blue-400">Ca</span> Afferent Coupling — 有多少模块依赖本模块（越高越稳定，改动影响面越大）</div>
      <div><span class="text-purple-400">Ce</span> Efferent Coupling — 本模块依赖多少模块（越高越脆弱）</div>
      <div><span style="color:var(--c-text-mid)">I</span>  Instability = Ce ÷ (Ca + Ce)，0 = 完全稳定，1 = 完全不稳定</div>
    </div>`;
}

async function renderTargetGraph(data, filter) {
  const graphEl = document.getElementById('targets-graph');
  const { nodes, edges } = data;

  const nodeMap = Object.fromEntries(nodes.map(n => [n.id, n]));

  // Determine which nodes to show
  let visible = new Set(nodes.map(n => n.id));
  if (filter === 'exec')  visible = new Set(nodes.filter(n => n.type === 'executable' && !n.is_test).map(n => n.id));
  else if (filter === 'test')  visible = new Set(nodes.filter(n => n.is_test).map(n => n.id));
  else if (filter === 'lib')   visible = new Set(nodes.filter(n => n.type === 'library').map(n => n.id));
  else if (filter === 'iface') visible = new Set(nodes.filter(n => n.type === 'interface').map(n => n.id));

  // Include direct deps of visible nodes
  if (filter !== 'all') {
    for (const e of edges) {
      if (visible.has(e.from)) visible.add(e.to);
    }
  }

  if (!visible.size) {
    graphEl.innerHTML = '<div class="text-sm py-8" style="color:var(--c-text-dim);text-align:center">无匹配 target</div>';
    return;
  }

  const sid = id => id.replace(/[^a-zA-Z0-9_]/g, '_');
  const lines = ['flowchart LR'];
  lines.push('  classDef exec    fill:#1e3a5f,stroke:#3b82f6,color:#93c5fd');
  lines.push('  classDef test    fill:#431407,stroke:#f97316,color:#fdba74');
  lines.push('  classDef lib     fill:#14532d,stroke:#22c55e,color:#86efac');
  lines.push('  classDef iface   fill:#2d1b4e,stroke:#a855f7,color:#d8b4fe');
  lines.push('  classDef ext     fill:#1e293b,stroke:#475569,color:#64748b');

  for (const id of visible) {
    const n = nodeMap[id];
    const label = n?.alias ? `"${id}\n${n.alias}"` : `"${id}"`;
    if (!n) {
      lines.push(`  ${sid(id)}(${label}):::ext`);
    } else if (n.is_test) {
      lines.push(`  ${sid(id)}([${label}]):::test`);
    } else if (n.type === 'executable') {
      lines.push(`  ${sid(id)}([${label}]):::exec`);
    } else if (n.type === 'interface') {
      lines.push(`  ${sid(id)}{{${label}}}:::iface`);
    } else {
      lines.push(`  ${sid(id)}[${label}]:::lib`);
    }
  }

  for (const e of edges) {
    if (!visible.has(e.from) || !visible.has(e.to)) continue;
    const arrow = e.kind === 'INTERFACE' ? '-.->' : '-->';
    const lbl   = e.kind !== 'PRIVATE'  ? `|${e.kind}|` : '';
    lines.push(`  ${sid(e.from)} ${arrow}${lbl} ${sid(e.to)}`);
  }

  try {
    const id = 'mg_' + Date.now();
    const { svg } = await mermaid.render(id, lines.join('\n'));
    graphEl.innerHTML = svg;
  } catch(e) {
    graphEl.innerHTML = '<pre class="text-xs text-red-400 text-left p-2">' + esc(String(e)) + '\n\n' + esc(lines.join('\n')) + '</pre>';
  }
}

function renderTargetTable(data, filter) {
  const tableEl = document.getElementById('targets-table');
  let nodes = data.nodes;

  if (filter === 'exec') nodes = nodes.filter(n => n.type === 'executable' && !n.is_test);
  else if (filter === 'test')  nodes = nodes.filter(n => n.is_test);
  else if (filter === 'lib')   nodes = nodes.filter(n => n.type === 'library');
  else if (filter === 'iface') nodes = nodes.filter(n => n.type === 'interface');

  const directDeps = {};
  for (const e of data.edges) {
    directDeps[e.from] = directDeps[e.from] || [];
    directDeps[e.from].push(e);
  }

  const typeBadge = n => n.is_test
    ? '<span class="tag" style="background:#431407;color:#fdba74">test</span>'
    : n.type === 'executable'
      ? '<span class="tag" style="background:#1e3a5f;color:#93c5fd">executable</span>'
      : n.type === 'interface'
        ? '<span class="tag" style="background:#2d1b4e;color:#d8b4fe">interface</span>'
        : '<span class="tag" style="background:#14532d;color:#86efac">library</span>';

  const kindColor = k => k === 'PUBLIC' ? 'text-green-400' : k === 'INTERFACE' ? 'text-purple-400' : 'text-blue-400';

  tableEl.innerHTML = nodes.map(n => {
    const deps = (directDeps[n.id] || []).map(e =>
      `<span class="font-mono text-xs ${kindColor(e.kind)}">${esc(e.to)}</span>
       <span class="text-xs" style="color:var(--c-text-dim)">${e.kind}</span>`
    ).join(`<span class="mx-1" style="color:var(--c-border2)">·</span>`);

    const trans = n.transitive_deps.filter(d => !(directDeps[n.id]||[]).some(e=>e.to===d));
    const transHtml = trans.length
      ? `<div class="mt-2 text-xs" style="color:var(--c-text-dim)">传递依赖：${trans.map(d=>`<span class="font-mono" style="color:var(--c-text-mid)">${esc(d)}</span>`).join(' › ')}</div>`
      : '';

    return `<div class="card space-y-2">
      <div class="flex items-center gap-2 flex-wrap">
        ${typeBadge(n)}
        <span class="font-mono font-semibold text-sm" style="color:var(--c-text)">${esc(n.id)}</span>
        ${n.alias ? `<span class="text-xs font-mono" style="color:var(--c-text-dim)">${esc(n.alias)}</span>` : ''}
        <span class="ml-auto text-xs font-mono" style="color:var(--c-text-dim)">${esc(n.file)}</span>
      </div>
      ${deps ? `<div class="flex flex-wrap items-center gap-2">${deps}</div>` : `<div class="text-xs" style="color:var(--c-text-dim)">无依赖</div>`}
      ${transHtml}
    </div>`;
  }).join('');
}

// ─── Reports ──────────────────────────────────────────────────────────────────
let _allReports = [];

async function loadReports() {
  const [list, buildDirs] = await Promise.all([
    api('GET', '/api/reports'), api('GET', '/api/build-dirs')
  ]);
  _allReports = list;

  // 填充目录过滤器
  const sel = document.getElementById('reports-filter');
  const prev = sel.value;
  sel.innerHTML = '<option value="">所有构建目录</option>' +
    buildDirs.map(d => `<option value="${esc(d.name)}">${esc(d.name)}</option>`).join('');
  if (prev) sel.value = prev;

  filterReports();
}

function filterReports() {
  const filter = document.getElementById('reports-filter').value;
  const el = document.getElementById('reports-list');
  const filtered = filter ? _allReports.filter(r => r.build_dir === filter) : _allReports;

  if (!filtered.length) {
    el.innerHTML = '<p class="text-xs p-2" style="color:var(--c-text-dim)">暂无报告。<br>执行 Build → Report 后刷新。</p>';
    return;
  }

  // 按 build_dir 分组
  const groups = {};
  for (const r of filtered) {
    (groups[r.build_dir] = groups[r.build_dir] || []).push(r);
  }

  const fileIcon = { json: '▣', xml: '◎', log: '≡' };
  el.innerHTML = Object.entries(groups).map(([dir, files]) => `
    <div class="mb-3">
      ${filter ? '' : `<div class="text-xs px-2 py-1 font-mono" style="color:var(--c-text-dim)">${esc(dir)}</div>`}
      ${files.map(r => {
        const ext = r.name.split('.').pop();
        const icon = fileIcon[ext] || '▪';
        return `<button class="w-full text-left rounded px-3 py-2 transition-colors"
                  style="background:none;border:none;cursor:pointer"
                  onmouseover="this.style.background='rgba(0,200,232,0.05)'"
                  onmouseout="this.style.background='none'"
                  onclick="viewReport('${esc(r.path)}','${esc(r.build_dir)}')">
          <div class="flex items-center gap-1.5">
            <span style="color:var(--c-cyan);font-size:0.75rem">${icon}</span>
            <span class="text-xs font-mono" style="color:var(--c-text)">${esc(r.name)}</span>
          </div>
        </button>`;
      }).join('')}
    </div>
  `).join('');
}

async function viewReport(path, buildDir) {
  const viewer = document.getElementById('report-viewer');
  viewer.innerHTML = '<div class="text-sm" style="color:var(--c-text-mid)">Loading…</div>';

  const name = path.split('/').pop();
  const header = `<div class="text-xs font-mono mb-4" style="color:var(--c-text-dim)">${esc(path)}</div>`;

  // JUnit XML 和 tests.log：复用 test results API
  if (name === 'tests.junit.xml' || name === 'tests.log') {
    const tr = await api('GET', '/api/test-results?build=' + encodeURIComponent(buildDir));
    if (!tr || !tr.total) {
      viewer.innerHTML = header + '<p class="text-sm" style="color:var(--c-text-dim)">暂无测试结果数据。</p>';
      return;
    }
    viewer.innerHTML = header + renderTestReportFull(tr);
    return;
  }

  const res = await api('GET', '/api/report?path=' + encodeURIComponent(path));
  if (res.error) { viewer.innerHTML = header + '<div class="text-red-400 text-sm">' + esc(res.error) + '</div>'; return; }

  if (name === 'build-report.json') {
    try {
      viewer.innerHTML = header + renderBuildReport(JSON.parse(res.content));
      return;
    } catch(e) {}
  }

  viewer.innerHTML = header + `<pre class="log text-xs whitespace-pre-wrap" style="color:var(--c-text)">${esc(res.content)}</pre>`;
}

function renderBuildReport(o) {
  const row = (label, val, mono) => val
    ? `<div class="flex gap-3 py-2 last:border-0" style="border-bottom:1px solid var(--c-border)">
         <div class="text-xs w-36 shrink-0" style="color:var(--c-text-dim)">${label}</div>
         <div class="text-xs ${mono ? 'font-mono' : ''}" style="color:var(--c-text)">${esc(String(val))}</div>
       </div>` : '';
  const badge = (txt, color) => `<span class="tag tag-${color} mr-1">${esc(txt)}</span>`;

  const configs = o.build_type_or_configs
    ? o.build_type_or_configs.split(/[\s;,]+/).filter(Boolean)
    : [];

  return `
  <div class="space-y-4 max-w-2xl">
    <div class="card">
      <div class="section-title">项目</div>
      ${row('名称', o.project)}
      ${row('生成时间', o.timestamp)}
      ${row('Git 提交', o.git_hash, true)}
      ${row('耗时', o.elapsed_seconds !== 'unknown' ? o.elapsed_seconds + ' 秒' : '—')}
    </div>
    <div class="card">
      <div class="section-title">构建</div>
      ${row('生成器', o.generator, true)}
      <div class="flex gap-3 py-2" style="border-bottom:1px solid var(--c-border)">
        <div class="text-xs w-36 shrink-0" style="color:var(--c-text-dim)">配置</div>
        <div>${configs.map(c => badge(c, 'gray')).join('')}</div>
      </div>
      ${row('源码目录', o.source_dir, true)}
      ${row('构建目录', o.build_dir, true)}
      ${row('包含测试', o.tests_included ? '是' : '否')}
    </div>
    <div class="card">
      <div class="section-title">编译器</div>
      ${row('CXX', o.compiler_cxx, true)}
      ${row('编译器 ID', o.compiler_cxx_id)}
      ${row('版本', o.compiler_cxx_version, true)}
    </div>
    <div class="card">
      <div class="section-title">系统</div>
      ${row('OS', o.system_name)}
      ${row('版本', o.system_version, true)}
      ${row('处理器', o.system_processor, true)}
    </div>
  </div>`;
}

function renderTestReportFull(tr) {
  const allPassed = tr.failed === 0;
  const passRate = tr.total > 0 ? Math.round(tr.passed / tr.total * 100) : 0;
  const barColor = allPassed ? 'bg-green-500' : 'bg-red-500';

  const rows = tr.tests.map(t => {
    const icon = t.status === 'passed' ? '<span class="text-green-400 text-base">✓</span>'
               : t.status === 'skipped' ? '<span class="text-yellow-400 text-base">⊝</span>'
               : '<span class="text-red-400 text-base">✗</span>';
    const nameCol = t.status === 'failed' ? '#fca5a5'
                  : t.status === 'skipped' ? '#fde68a' : 'var(--c-text)';
    const msg = t.message
      ? `<div class="mt-1 ml-6 text-xs font-mono rounded p-2 whitespace-pre-wrap" style="color:#fca5a5;background:rgba(127,29,29,0.25)">${esc(t.message)}</div>`
      : '';
    return `<div class="py-2 last:border-0" style="border-bottom:1px solid var(--c-border)">
      <div class="flex items-center gap-3">
        ${icon}
        <span class="text-sm flex-1" style="color:${nameCol}">${esc(t.name)}</span>
        <span class="text-xs font-mono" style="color:var(--c-text-dim)">${t.time}s</span>
      </div>${msg}
    </div>`;
  }).join('');

  return `
  <div class="max-w-2xl space-y-4">
    <div class="card">
      <div class="section-title">测试汇总</div>
      <div class="flex items-center gap-4 mb-3">
        <div class="text-3xl font-bold ${allPassed ? 'glow-green' : ''}" style="color:${allPassed ? 'var(--c-green)' : '#f87171'}">${passRate}%</div>
        <div class="flex-1">
          <div class="h-2 rounded-full overflow-hidden mb-1" style="background:var(--c-border)">
            <div class="${barColor} h-full rounded-full" style="width:${passRate}%"></div>
          </div>
          <div class="text-xs" style="color:var(--c-text-mid)">
            <span style="color:var(--c-green)">${tr.passed} 通过</span>
            ${tr.failed ? ` · <span style="color:#f87171">${tr.failed} 失败</span>` : ''}
            ${tr.skipped ? ` · <span style="color:#fde68a">${tr.skipped} 跳过</span>` : ''}
            · 共 ${tr.total} 个
          </div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="section-title">测试明细</div>
      ${rows}
    </div>
  </div>`;
}

// ─── Utilities ────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Init ─────────────────────────────────────────────────────────────────────
navigate('dashboard');
</script>
